user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml;
  client_max_body_size 250M;

  # Docker's embedded DNS — re-resolve every 10s so we don't cache a stale
  # container IP if a service is recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # WebSocket upgrade: pass "upgrade" only for real WS requests, else "close".
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- HTTP :80 — ACME challenge + redirect everything else to HTTPS ----
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS :443 — the app ----
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/178-63-95-122.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178-63-95-122.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — serve index.html for any unmatched route
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend API. Variable proxy_pass forces per-request DNS via the resolver.
    location /api/ {
      set $backend_host "backend";
      proxy_pass http://$backend_host:3001$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }

    location = /health {
      set $backend_host "backend";
      proxy_pass http://$backend_host:3001/health;
      proxy_set_header Host $host;
    }

    # Phone stream: /stream/<slotId>/... → scrcpy-<slotId>:6080/...
    # Serves noVNC assets (phone.html, core/*) and the /websockify WebSocket.
    location ~ ^/stream/([0-9]+)/(.*)$ {
      set $stream_host "scrcpy-$1";
      proxy_pass http://$stream_host:6080/$2$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
