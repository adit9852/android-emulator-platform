user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss text/xml;
  client_max_body_size 150M;

  # Docker's embedded DNS — re-resolve every 10s so we don't cache a stale
  # backend container IP if it's recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — serve index.html for any unmatched route
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend API. Using a variable forces nginx to use the resolver above
    # per-request, instead of resolving "backend" once at startup.
    location /api/ {
      set $backend_host "backend";
      proxy_pass http://$backend_host:3001$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 90s;
    }

    location = /health {
      set $backend_host "backend";
      proxy_pass http://$backend_host:3001/health;
      proxy_set_header Host $host;
    }
  }
}
