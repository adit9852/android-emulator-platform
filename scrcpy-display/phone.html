<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>device</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #screen { width: 100vw; height: 100vh; background: #000; }
  </style>
</head>
<body>
  <div id="screen"></div>
  <script type="module">
    import RFB from './core/rfb.js';
    const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const port = window.location.port || (proto === 'wss' ? 443 : 80);
    const url = `${proto}://${window.location.hostname}:${port}/websockify`;

    function connect() {
      const rfb = new RFB(document.getElementById('screen'), url, {});
      // Scale the remote framebuffer to fit this page (keeps aspect, letterboxes
      // on black). noVNC auto-maps pointer/keyboard coordinates through the
      // scale, so input keeps working — no CSS transform needed.
      rfb.scaleViewport = true;
      rfb.clipViewport = false;
      rfb.resizeSession = false;
      rfb.background = '#000';
      rfb.focusOnClick = true;
      // Favour frame rate over crispness for smooth motion (the source is
      // already downscaled, so lower JPEG quality is barely visible).
      rfb.qualityLevel = 5;
      rfb.compressionLevel = 2;
      rfb.addEventListener('disconnect', () => setTimeout(connect, 1500));
    }
    connect();
  </script>
</body>
</html>
